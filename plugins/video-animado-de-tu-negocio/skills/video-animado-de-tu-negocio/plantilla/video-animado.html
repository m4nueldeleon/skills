<style>

<script>

/* ======================== FIN DEL BLOQUE EDITABLE ===================== */

(() => {
"use strict";
const W = 1080, H = 1920;
const PALETAS = {
  cobalto: { fondo: "#112a6b", texto: "#f2f4f8", acento: "#ffc93c" },

};

               respaldo: '"Arial Black","Helvetica Neue",Arial,sans-serif', tracking: "-0.035em", interlineado: 1.0, mayus: "none" },
  cercano:   { titulo: ["Bricolage Grotesque", 800], texto: ["Bricolage Grotesque", 600], css: "family=Bricolage+Grotesque:opsz,wght@12..96,500..800",
               respaldo: '"Avenir Next","Segoe UI",system-ui,sans-serif', respaldoTexto: '"Avenir Next","Segoe UI",system-ui,sans-serif', tracking: "-0.035em", interlineado: 0.98, mayus: "none" },
  confiable: { titulo: ["Manrope", 800], texto: ["Manrope", 600], css: "family=Manrope:wght@500;600;700;800",

  impacto:   { titulo: ["Anton", 400], texto: ["Archivo", 600], css: "family=Anton&family=Archivo:wght@500;600;700",

  sobrio:    { titulo: ["Inter Tight", 800], texto: ["Inter Tight", 500], css: "family=Inter+Tight:wght@500;600;700;800",

};
const RESPALDO_TEXTO = '"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif';
const TRANS = { ninguna: 0, corte: 0, empuje: 0.5, zoom: 0.5, barrido: 0.6 };
const SIN_FIRMA = new Set(["marca", "cierre"]);
const LIMITE_PALABRAS = { palabras: 9, frase: 12, marca: 9, numero: 10, foto: 9, lista: 12, contraste: 13, oferta: 15, cierre: 99 };
const ICONOS = {
  chat: '<path d="M4 20l1.3-3.9A8 8 0 1 1 8 19.1z"/>',
  telefono: '<path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  web: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  arroba: '<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>',
  reloj: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  correo: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  flecha: '<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const ICONO_DE = { whatsapp: "chat", telefono: "telefono", direccion: "pin", web: "web", instagram: "arroba", facebook: "arroba",
  tiktok: "arroba", redes: "arroba", horario: "reloj", correo: "correo", otro: "flecha" };
const SIN_CORTE = new Set(["whatsapp", "telefono", "instagram", "facebook", "tiktok", "redes", "correo", "web"]);
const CHECK = '<svg viewBox="0 0 48 48" aria-hidden="true"><path pathLength="1" d="M9 25l10 10L39 13"/></svg>';

/* ---------- utilidades ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const EASE = {
  out: p => 1 - Math.pow(1 - p, 4),
  inOut: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  back: p => { const c = 1.5; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }
};
const avisos = [];
function avisar(msg) { avisos.push(msg); console.warn("[video] " + msg); }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function lineasRicas(texto) {
  let enf = false;
  return String(texto ?? "").split("\n").map(linea => {
    let html = enf ? '<span class="enf">' : "";
    linea.split("*").forEach((seg, j) => { if (j > 0) { enf = !enf; html += enf ? '<span class="enf">' : "</span>"; } html += esc(seg); });
    return enf ? html + "</span>" : html;
  });
}
const rico = t => lineasRicas(t).join("<br>");
function palabrasDe(texto) {
  const lineas = []; const estado = { enf: false };
  String(texto ?? "").split("\n").forEach(linea => {
    const words = []; let cur = null;
    for (const ch of linea) {
      if (ch === "*") { estado.enf = !estado.enf; continue; }
      if (/\s/.test(ch)) { cur = null; continue; }
      if (!cur) { cur = []; words.push(cur); }
      const ult = cur[cur.length - 1];
      if (ult && ult.enf === estado.enf) ult.t += ch; else cur.push({ t: ch, enf: estado.enf });
    }
    lineas.push(words);
  });
  return lineas;
}
const cuentaPalabras = s => String(s ?? "").replace(/\*/g, "").split(/\s+/).filter(Boolean).length;
const hexValido = h => typeof h === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(h.trim());
function rgb(h) { h = h.trim().slice(1); if (h.length === 3) h = [...h].map(c => c + c).join(""); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const aHex = c => "#" + c.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, "0")).join("");
const mezcla = (a, b, p) => { const A = rgb(a), B = rgb(b); return aHex(A.map((v, i) => lerp(v, B[i], p))); };
function lum(h) { const c = rgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
const contraste = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

/* ---------- colores y letra ---------- */
const raiz = document.documentElement.style;
const escenario = document.getElementById("escenario");
let pal = PALETAS[VIDEO.paleta] || PALETAS.carbon;
if (VIDEO.colores) {
  const c = VIDEO.colores;
  if (hexValido(c.fondo) && hexValido(c.texto) && hexValido(c.acento)) pal = { fondo: c.fondo.trim(), texto: c.texto.trim(), acento: c.acento.trim() };
  else avisar("Los colores deben ir en formato #RRGGBB (fondo, texto y acento). Usé la paleta por defecto.");
}
if (!VIDEO.colores && VIDEO.paleta && !PALETAS[VIDEO.paleta]) avisar(`No conozco la paleta «${VIDEO.paleta}». Usé «carbon».`);
const oscuro = lum(pal.fondo) < 0.4;
const cTexto = contraste(pal.texto, pal.fondo);
if (cTexto < 4.5) avisar(`El texto casi no se distingue del fondo (contraste ${cTexto.toFixed(1)}:1; mínimo 4.5:1).`);
let mixSuave = 0.32, textoSuave = mezcla(pal.texto, pal.fondo, mixSuave);
while (contraste(textoSuave, pal.fondo) < 4.5 && mixSuave > 0.02) { mixSuave -= 0.04; textoSuave = mezcla(pal.texto, pal.fondo, mixSuave); }
const cAcento = contraste(pal.acento, pal.fondo);
const marcador = cAcento < 3;
if (marcador) escenario.classList.add("marcador");
const sobreAcento = [pal.fondo, pal.texto, "#111111", "#ffffff"].reduce((m, c) => (contraste(c, pal.acento) > contraste(m, pal.acento) ? c : m));

/* ---------- animación de entrada (función pura del tiempo) ---------- */
function entra(e, { d = 0, dur = 0.55, x = 0, y = 0, yp = 0, s = 1, rot = 0, blur = 0, o = 0, curva = "out" } = {}) {
  return lt => {
    const p = clamp((lt - d) / dur), k = EASE[curva](p), q = 1 - k;
    if (o !== 1) e.style.opacity = String(clamp(o + (1 - o) * EASE.out(p)));
    const tr = [];
    if (x || y) tr.push(`translate(${(x * q).toFixed(2)}px,${(y * q).toFixed(2)}px)`);
    if (yp) tr.push(`translateY(${(yp * q).toFixed(2)}%)`);
    if (s !== 1) tr.push(`scale(${(s + (1 - s) * k).toFixed(4)})`);
    if (rot) tr.push(`rotate(${(rot * q).toFixed(2)}deg)`);
    e.style.transform = tr.join(" ");

function anima(E, e, op) { E.pistas.push(entra(e, op)); E.listo = Math.max(E.listo, (op.d || 0) + (op.dur || 0.55)); }

function durPorDefecto(sc) {
  switch (sc.tipo) {
    case "cierre": return 3.6;
    case "lista": return clamp(1.0 + (sc.items || []).length * 0.42, 1.8, 3.0);
    case "numero": return 2.0;
    case "oferta": return 2.8;
    case "marca": return 1.8;
    case "contraste": return 2.4;
    case "foto": return 2.2;
    default: return clamp(0.9 + cuentaPalabras(sc.texto) * 0.2 + cuentaPalabras(sc.chico) * 0.12, 1.3, 2.4);
  }
}
function textoDeEscena(sc) { return [sc.texto, sc.chico, sc.titulo, sc.antes, sc.ahora, sc.arriba, sc.grande, sc.nota, sc.lema, ...(sc.items || [])].filter(Boolean).join(" "); }

/* ---------- construir la línea de tiempo ---------- */
const ESC = [];
let barridos = 0;
const PATRON = ["empuje", "corte", "empuje", "zoom"];
(VIDEO.escenas || []).forEach((sc, idx) => {
  if (!CONSTRUIR[sc.tipo]) { avisar(`La escena número ${idx + 1} de VIDEO.escenas usa el tipo «${sc.tipo}», que no existe. La salté.`); return; }
  const i = ESC.length;
  const nodo = el("section", "escena"), cont = el("div", "contenido");
  nodo.appendChild(cont);
  const E = { i, sc, nodo, cont, pistas: [], listo: 0, dur: Number(sc.dur) > 0 ? Number(sc.dur) : durPorDefecto(sc) };
  let entrada = sc.entrada;
  if (!TRANS.hasOwnProperty(entrada)) {
    if (i === 0) entrada = "ninguna";
    else if (VIDEO.transicion && VIDEO.transicion !== "mixta" && TRANS.hasOwnProperty(VIDEO.transicion)) entrada = VIDEO.transicion;
    else if ((sc.tipo === "oferta" || sc.tipo === "cierre") && barridos < 2) entrada = "barrido";
    else if (sc.tipo === "marca") entrada = "zoom";
    else entrada = PATRON[i % PATRON.length];
  }
  if (i === 0) entrada = "ninguna";
  if (entrada === "barrido") barridos++;
  E.entrada = entrada;
  try { CONSTRUIR[sc.tipo](sc, E); } catch (err) { avisar(`Escena ${idx + 1} (${sc.tipo}): ${err.message}`); }
  const tope = LIMITE_PALABRAS[sc.tipo] ?? 10, nPal = cuentaPalabras(textoDeEscena(sc));
  if (nPal > tope) avisar(`La escena ${i + 1} (${sc.tipo}) tiene ${nPal} palabras; el máximo para que se alcance a leer es ${tope}.`);
  escenario.insertBefore(nodo, document.getElementById("firma"));
  ESC.push(E);
});
if (!ESC.length) avisar("No hay escenas: agrega al menos una en VIDEO.escenas.");
let reloj = 0;
ESC.forEach((E, i) => {
  E.ini = reloj; E.fin = reloj + E.dur; reloj = E.fin;
  const sig = ESC[i + 1];
  E.tOut = sig ? TRANS[sig.entrada] : 0;
  E.heroe = Math.min(E.ini + E.listo + 0.05, E.fin - E.tOut / 2 - 0.02);
  if (E.listo > E.dur - E.tOut / 2 + 0.01) avisar(`La escena ${i + 1} no alcanza a terminar de aparecer: dale al menos ${(E.listo + E.tOut / 2 + 0.3).toFixed(1)} s.`);
});
const DURACION = Math.max(0.5, reloj);
if (DURACION < 12 || DURACION > 32) avisar(`El video dura ${DURACION.toFixed(1)} s; lo recomendable es de 15 a 30 s.`);
const firma = document.getElementById("firma");
firma.textContent = VIDEO.firma === false ? "" : (VIDEO.negocio || "");

/* ---------- ajustar el texto al espacio (nunca se sale ni se corta) ---------- */
function ajustarEscena(E) {
  const nodo = E.nodo, antes = nodo.style.display;
  nodo.style.display = "block"; nodo.style.visibility = "hidden"; nodo.classList.add("midiendo");
  // primero lo que se ajusta solo (el precio dentro del círculo), luego la escena completa
  nodo.querySelectorAll("[data-solo]").forEach(e => {
    let s = Number(e.dataset.solo); e.style.fontSize = s + "px";
    while (e.scrollWidth > e.clientWidth + 1 && s > 44) { s *= 0.95; e.style.fontSize = s.toFixed(1) + "px"; }
  });
  const fits = [...nodo.querySelectorAll("[data-fit]")];
  const aplicar = k => fits.forEach(e => { e.style.fontSize = (Number(e.dataset.fit) * k).toFixed(2) + "px"; });
  const lineas = [...nodo.querySelectorAll(".linea")];
  const cabe = () => E.cont.scrollHeight <= E.cont.clientHeight + 1 && E.cont.scrollWidth <= E.cont.clientWidth + 1 && fits.every(e => e.scrollWidth <= e.clientWidth + 1) && lineas.every(e => e.scrollWidth <= e.clientWidth + 1);
  aplicar(1); E.k = 1;
  if (!cabe()) {
    let lo = 0.25, hi = 1;
    for (let n = 0; n < 14; n++) { const m = (lo + hi) / 2; aplicar(m); if (cabe()) lo = m; else hi = m; }
    aplicar(lo); E.k = lo;
    if (!cabe()) avisar(`La escena ${E.i + 1} tiene demasiado texto para la pantalla: acórtalo.`);
  }
  nodo.classList.remove("midiendo"); nodo.style.display = antes; nodo.style.visibility = "";
}
const ajustarTodo = () => ESC.forEach(ajustarEscena);

/* ---------- pintar un instante (determinista: mismo t = mismo cuadro) ---------- */
const POSES = {
  circulo: [[860, 430, 1], [200, 1560, 0.9], [980, 1480, 1.12], [140, 330, 0.82], [720, 1760, 1], [1010, 860, 0.95]],
  barra: [[540, 1500, -14], [540, 400, 9], [300, 1180, -22], [800, 640, 16], [540, 1660, -7], [540, 290, 5]],
  aro: [[190, 560], [880, 1290], [760, 330], [250, 1460], [900, 1080], [150, 900]]
};
const formas = { circulo: escenario.querySelector(".circulo"), barra: escenario.querySelector(".barra"), aro: escenario.querySelector(".aro") };
const barrido = document.getElementById("barrido");
const pose = (lista, j) => lista[((j % lista.length) + lista.length) % lista.length];
const mezclaPose = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
function estiloEntrada(tipo, p) {
  if (tipo === "barrido") return [p >= 0.5, 1, ""];
  const q = clamp((p - 0.4) / 0.6);
  if (tipo === "zoom") return [true, EASE.out(q), `scale(${(0.94 + 0.06 * EASE.out(q)).toFixed(4)})`];
  return [true, EASE.out(q), `translateY(${(110 * (1 - EASE.out(q))).toFixed(2)}px)`];
}
function estiloSalida(tipo, p) {
  if (tipo === "barrido") return [p < 0.5, 1, ""];
  const q = clamp(p / 0.6);
  if (tipo === "zoom") return [q < 1, 1 - EASE.inOut(q), `scale(${(1 + 0.07 * EASE.inOut(q)).toFixed(4)})`];
  return [q < 1, 1 - EASE.inOut(q), `translateY(${(-110 * EASE.inOut(q)).toFixed(2)}px)`];
}
function pintar(t) {
  let pesoFirma = 0, yBarrido = H;
  ESC.forEach((E, i) => {
    const tIn = i ? TRANS[E.entrada] : 0, sig = ESC[i + 1];
    const desde = i ? E.ini - tIn / 2 : -Infinity, hasta = sig ? E.fin + E.tOut / 2 : Infinity;
    let vis = t >= desde && t < hasta, op = 1, tr = "";
    if (vis && tIn && t < E.ini + tIn / 2) [vis, op, tr] = estiloEntrada(E.entrada, (t - desde) / tIn);
    if (vis && E.tOut && t >= E.fin - E.tOut / 2) [vis, op, tr] = estiloSalida(sig.entrada, (t - (E.fin - E.tOut / 2)) / E.tOut);
    if (E.entrada === "barrido" && Math.abs(t - E.ini) < tIn / 2) {
      const p = (t - (E.ini - tIn / 2)) / tIn;
      yBarrido = p < 0.5 ? H * (1 - EASE.inOut(p * 2)) : -H * EASE.inOut((p - 0.5) * 2);
    }
    E.nodo.style.display = vis ? "block" : "none";
    if (!vis) return;
    E.nodo.style.opacity = String(op);
    E.nodo.style.transform = tr;
    const lt = t - E.ini;
    for (const f of E.pistas) f(lt);
    if (!SIN_FIRMA.has(E.sc.tipo)) pesoFirma += op;
  });
  barrido.style.transform = `translateY(${yBarrido.toFixed(1)}px)`;
  firma.style.opacity = String(clamp(pesoFirma));
  // formas del fondo: cambian de lugar en cada escena y se mueven lento
  let k = 0;
  for (let i = 0; i < ESC.length; i++) if (t >= ESC[i].ini - 0.3) k = i;
  const p = k && ESC[k] ? EASE.inOut(clamp((t - (ESC[k].ini - 0.3)) / 0.6)) : 1;
  const [cx, cy, cs] = mezclaPose(pose(POSES.circulo, k - 1), pose(POSES.circulo, k), p);
  const [bx, by, br] = mezclaPose(pose(POSES.barra, k - 1), pose(POSES.barra, k), p);
  const [ax, ay] = mezclaPose(pose(POSES.aro, k - 1), pose(POSES.aro, k), p);
  formas.circulo.style.transform = `translate(${(cx - 625 + 6 * t).toFixed(1)}px,${(cy - 625 - 5 * t).toFixed(1)}px) scale(${cs.toFixed(4)})`;
  formas.barra.style.transform = `translate(${(bx - 850).toFixed(1)}px,${(by - 75).toFixed(1)}px) rotate(${(br + 0.35 * t).toFixed(3)}deg)`;
  formas.aro.style.transform = `translate(${(ax - 280 - 4 * t).toFixed(1)}px,${(ay - 280 + 3 * t).toFixed(1)}px)`;
}

/* ---------- reproductor ---------- */
const qs = new URLSearchParams(location.search);
const EXPORTAR = qs.has("exportar");
const marco = document.getElementById("marco"), controles = document.getElementById("controles");
const lineaTiempo = document.getElementById("linea-tiempo"), posicion = document.getElementById("posicion");
const bPlay = document.getElementById("b-play"), tiempo = document.getElementById("tiempo");
const cajaAvisos = document.getElementById("avisos");
function mostrarAvisos() {
  if (EXPORTAR || !avisos.length) return;
  cajaAvisos.innerHTML = `<b>Avisos para corregir (cópialos y pégaselos a Claude):</b>${avisos.map(a => "• " + esc(a)).join("<br>")}`;
  cajaAvisos.classList.add("hay");
}
let tActual = 0, reproduciendo = false, base = 0, raf = 0;
const ICO_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>';
const ICO_PAUSA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function actualizarUI() {
  if (EXPORTAR) return;
  bPlay.innerHTML = reproduciendo ? `${ICO_PAUSA}Pausa` : `${ICO_PLAY}${tActual >= DURACION ? "Ver de nuevo" : "Reproducir"}`;
  tiempo.textContent = `${mmss(tActual)} / ${mmss(DURACION)}`;
  posicion.value = String(Math.round((tActual / DURACION) * 1000));
}
function cuadro(ahora) {
  if (!reproduciendo) return;
  tActual = (ahora - base) / 1000;
  if (tActual >= DURACION) { tActual = DURACION; reproduciendo = false; }
  pintar(tActual); actualizarUI();
  if (reproduciendo) raf = requestAnimationFrame(cuadro);
}
function play() { if (tActual >= DURACION) tActual = 0; base = performance.now() - tActual * 1000; reproduciendo = true; cancelAnimationFrame(raf); raf = requestAnimationFrame(cuadro); actualizarUI(); }
function pausa() { reproduciendo = false; cancelAnimationFrame(raf); actualizarUI(); }
function seek(t) { pausa(); tActual = clamp(Number(t) || 0, 0, DURACION); pintar(tActual); actualizarUI(); }
function alternar() { reproduciendo ? pausa() : play(); }

function encajar() {
  const lleno = document.body.classList.contains("grabando") || document.body.classList.contains("maximo") || !!document.fullscreenElement;
  let k = 1;
  if (!EXPORTAR) {
    const altoUI = lleno ? 0 : controles.offsetHeight + lineaTiempo.offsetHeight + cajaAvisos.offsetHeight + (cajaAvisos.offsetHeight ? 50 : 40);
    const aw = innerWidth - (lleno ? 0 : 20), ah = innerHeight - altoUI;
    k = Math.max(0.05, Math.min(aw / W, ah / H));
  }
  marco.style.width = (W * k).toFixed(1) + "px"; marco.style.height = (H * k).toFixed(1) + "px";
  escenario.style.transform = `scale(${k})`;
  lineaTiempo.style.width = Math.max(240, W * k).toFixed(0) + "px";
}
async function pantallaCompleta(encender) {
  const raizDoc = document.documentElement;
  try {
    if (encender && !document.fullscreenElement) { if (!raizDoc.requestFullscreen) throw new Error("sin pantalla completa"); await raizDoc.requestFullscreen(); }
    else if (!encender && document.fullscreenElement) await document.exitFullscreen();
  } catch (e) { document.body.classList.toggle("maximo", encender); }
  if (!encender) document.body.classList.remove("maximo");
  encajar();
}
function entrarGrabar() { document.body.classList.add("grabando", "esperando"); seek(0); pantallaCompleta(true); }
function arrancarGrabacion() { document.body.classList.remove("esperando"); setTimeout(play, 1000); }
function salirGrabar() { document.body.classList.remove("grabando", "esperando"); pausa(); pantallaCompleta(false); }

if (EXPORTAR) document.body.classList.add("exportar");
else {
  bPlay.addEventListener("click", alternar);
  document.getElementById("b-inicio").addEventListener("click", () => { seek(0); play(); });
  document.getElementById("b-grabar").addEventListener("click", entrarGrabar);
  document.getElementById("b-pantalla").addEventListener("click", () => pantallaCompleta(!(document.fullscreenElement || document.body.classList.contains("maximo"))));
  posicion.addEventListener("input", () => seek((Number(posicion.value) / 1000) * DURACION));
  marco.addEventListener("click", () => {
    if (document.body.classList.contains("esperando")) arrancarGrabacion();
    else if (!document.body.classList.contains("grabando")) alternar();
  });
  addEventListener("keydown", e => {
    const enControl = e.target.closest && e.target.closest("button, input");
    if (e.key === "Escape" && document.body.classList.contains("grabando")) { salirGrabar(); return; }
    if (e.key === " " && !enControl) { e.preventDefault(); document.body.classList.contains("esperando") ? arrancarGrabacion() : alternar(); }
    else if (enControl) return;
    else if (e.key === "r" || e.key === "R") { seek(0); play(); }
    else if (e.key === "g" || e.key === "G") entrarGrabar();
    else if (e.key === "f" || e.key === "F") pantallaCompleta(!document.fullscreenElement);
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("grabando")) salirGrabar(); encajar(); });
  addEventListener("resize", encajar);
}

/* ---------- contrato para revisar y exportar a MP4 (scripts/) ---------- */
const info = {
  duracion: DURACION, avisos, fuentes: "cargando",
  contraste: { texto: +cTexto.toFixed(2), acento: +cAcento.toFixed(2), resaltadoConMarcador: marcador },
  escenas: ESC.map(E => ({ n: E.i + 1, tipo: E.sc.tipo, entrada: E.entrada, inicio: +E.ini.toFixed(3), fin: +E.fin.toFixed(3), heroe: +E.heroe.toFixed(3) }))
};
window.VIDEO_INFO = info;
window.DURACION = DURACION;
window.seek = seek;
ajustarTodo();
mostrarAvisos();
encajar();
seek(qs.has("t") ? Number(qs.get("t")) : 0);
const espera = (ms, valor) => new Promise(r => setTimeout(() => r(valor), ms));
window.LISTO = (async () => {
  await Promise.race([new Promise(r => { enlaceFuentes.onload = r; enlaceFuentes.onerror = r; }), espera(4000)]);
  const pedidas = [`${est.titulo[1]} 100px "${est.titulo[0]}"`, `${est.texto[1]} 100px "${est.texto[0]}"`, `700 100px "${est.texto[0]}"`];
  await Promise.race([Promise.all(pedidas.map(f => document.fonts.load(f).catch(() => []))), espera(5000)]);
  const cargada = fam => [...document.fonts].some(f => f.family.replace(/["']/g, "") === fam && f.status === "loaded");
  info.fuentes = cargada(est.titulo[0]) && cargada(est.texto[0]) ? "ok" : "respaldo";
  if (info.fuentes !== "ok") console.info("[video] No cargó la tipografía de Google Fonts: se ve con la letra de respaldo del sistema.");
  ajustarTodo(); mostrarAvisos(); encajar(); pintar(tActual);
  return true;
})();
if (!EXPORTAR && !qs.has("t")) window.LISTO.then(() => { if (!reproduciendo && tActual === 0) play(); });
})();
</script>
